name: Windows desktop artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint and build embedded frontend
        working-directory: web
        run: |
          npm run lint
          npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Test lifecycle and browser boundaries
        working-directory: desktop
        run: npm test
      - name: Build Windows installer without publishing
        working-directory: desktop
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Compute artifact checksum
        shell: pwsh
        run: |
          Get-ChildItem desktop/dist/*-setup.exe | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($_.Name)" | Set-Content -Encoding utf8 "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: chatgpt2api-windows-x64-${{ github.sha }}
          path: |
            desktop/dist/*-setup.exe
            desktop/dist/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
