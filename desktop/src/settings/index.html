<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>chatgpt2api · 连接设置</title>
  <link rel="stylesheet" href="./settings.css" />
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">c</span><span>chatgpt2api <small>桌面版</small></span></div>
    <h1>连接你的创作空间</h1>
    <p class="intro">在这台电脑上开始创作，或连接已有的服务器。</p>
    <form id="connection-form">
      <fieldset class="choices"><legend>运行方式</legend>
        <label class="choice"><input type="radio" name="mode" value="local" checked /><span><strong>本机空间</strong><small id="local-description">数据保存在这台电脑，关闭应用后服务随之停止。</small></span></label>
        <label class="choice"><input type="radio" name="mode" value="remote" /><span><strong>远程服务器</strong><small>连接现有服务，继续使用服务器上的账号和数据。</small></span></label>
      </fieldset>
      <section id="remote-fields" hidden><label class="field" for="remote-url">服务器地址</label><input id="remote-url" type="url" autocomplete="url" placeholder="https://canvas.example.com" /><p class="hint">填写域名和端口即可，例如 http://192.168.1.10:8090。</p></section>
      <section id="password-fields" hidden><label class="field" for="admin-password">设置管理员密码</label><input id="admin-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" placeholder="至少 12 个字符" /><p class="hint">账号为 admin。密码最多 72 个 UTF-8 字节（汉字通常占 3 字节）；请记住密码，连接设置不会保存它。</p></section>
      <section id="local-details" class="data-detail"><span>本地数据目录</span><p id="data-directory"></p></section>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="connect" type="submit">打开创作空间 <span aria-hidden="true">→</span></button>
    </form>
    <p class="footer">之后可在顶部菜单的「连接设置」中切换空间。</p>
  </main>
  <script src="./settings.js"></script>
</body>
</html>
