version: 2

project_name: chatgpt2api

builds:
  - id: chatgpt2api
    main: ./internal
    binary: chatgpt2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md
      - RELEASE_NOTES.md
      - .env.example
      - docker-compose.yml
      - src: agent-runtime/worker.mjs
        dst: agent-runtime/worker.mjs
      - src: agent-runtime/package.json
        dst: agent-runtime/package.json
      - src: agent-runtime/package-lock.json
        dst: agent-runtime/package-lock.json
      - src: agent-runtime/README.md
        dst: agent-runtime/README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

dockers_v2:
  - id: dockerhub
    dockerfile: Dockerfile.release
    extra_files:
      - agent-runtime/worker.mjs
      - agent-runtime/package.json
      - agent-runtime/package-lock.json
    images:
      - "mienvirtuoso/chatgpt2api"
    tags:
      - "{{ .Version }}"
      - "latest"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"

release:
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "{{ .Version }}"
  header: |
    {{ .Env.TAG_MESSAGE }}
  footer: |

    ---

    ## Docker

    ```bash
    docker pull mienvirtuoso/chatgpt2api:{{ .Version }}
    ```
